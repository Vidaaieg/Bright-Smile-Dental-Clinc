<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Make an Appointment | Bright Smile Clinic</title>
   <meta name="description" content="Book your appointment at Bright Smile Clinic in El Gouna, Hurghada. Choose your specialty, date and time online.">

   <!-- fonts and icons (Cairo carries the Arabic glyphs) -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

   <!-- custom css file link -->
   <link rel="stylesheet" href="../css/style.css">
   <link rel="icon" href="../images/logo.svg" type="image/svg+xml">
   <link rel="alternate icon" href="../images/favicon.png">
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <script src="../lang/translations.js" defer></script>
   <script src="../js/supabase-client.js" defer></script>
   <script src="../js/dental.js" defer></script>
   <script src="../js/auth.js" defer></script>
   <script src="../js/booking.js" defer></script>
   <script src="../js/analytics.js" defer></script>
   <script src="../js/bg-tooth.js" defer></script>
</head>

<body>

<div class="bg-tooth" aria-hidden="true">
   <div class="bg-tooth-3d" id="bg-tooth-3d">
      <i class="fas fa-tooth bg-tooth-face bg-tooth-face--front"></i>
      <i class="fas fa-tooth bg-tooth-face bg-tooth-face--back"></i>
   </div>
</div>

<!-- header section starts  -->

<header class="header">

   <div class="container header-inner">

      <a href="../index.html#home" class="logo" aria-label="Bright Smile Clinic — home">
         <img src="../images/logo.svg" alt="" class="logo-mark" width="44" height="44">
         <span class="logo-text"><span class="logo-name">Bright <span>Smile</span></span><span class="logo-sub">Clinic</span></span>
      </a>

      <nav class="nav" id="nav">
         <a href="../index.html#home" data-i18n="nav.home">Home</a>
         <a href="../index.html#about" data-i18n="nav.about">About</a>
         <a href="../index.html#services" data-i18n="nav.services">Services</a>
         <a href="contact.html" data-i18n="nav.contact">Contact</a>
      </nav>

      <div class="lang-switch">
         <select id="lang-select" aria-label="Language">
            <option value="en">EN</option>
            <option value="ar">ع</option>
            <option value="de">DE</option>
            <option value="ru">RU</option>
         </select>
      </div>

      <div class="header-actions">
         <a href="login.html" class="link-btn" data-i18n="btn.login">Login</a>
         <a href="appointment.html" class="link-btn" data-i18n="btn.appointment">Make Appointment</a>
      </div>

      <button type="button" id="menu-btn" class="menu-btn" data-i18n-aria="nav.menu" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav">
         <span></span>
         <span></span>
         <span></span>
      </button>

   </div>

</header>

<!-- header section ends -->

<main>

   <section class="form-section">

      <h1 class="heading" data-i18n="appt.heading">Make Appointment</h1>

      <form id="appointmentForm">

         <label for="name" data-i18n="appt.name">Your name</label>
         <input type="text" id="name" name="name" placeholder="Enter your name" data-i18n-placeholder="appt.name.ph" class="box" autocomplete="name" required>

         <label for="email" data-i18n="appt.email">Your email</label>
         <input type="email" id="email" name="email" placeholder="Eg. example@gmail.com" data-i18n-placeholder="signup.email.ph" class="box" autocomplete="email" required>

         <label for="number" data-i18n="appt.phone">Your phone number</label>
         <input type="tel" id="number" name="number" placeholder="Eg. +20 122-373-2698" data-i18n-placeholder="signup.phone.ph" class="box" autocomplete="tel" required>

         <label for="specialist" data-i18n="appt.specialty">Medical specialty</label>
         <select id="specialist" name="specialist" class="box" required>
            <option value="Consultation" data-i18n="svc.consultation.title">Consultation</option>
            <option value="Alignment specialist" data-i18n="svc.alignment.title">Alignment specialist</option>
            <option value="Cosmetic dentistry" data-i18n="svc.cosmetic-dentistry.title">Cosmetic dentistry</option>
            <option value="Oral hygiene experts" data-i18n="svc.oral-hygiene.title">Oral hygiene experts</option>
            <option value="Root canal specialist" data-i18n="svc.root-canal.title">Root canal specialist</option>
            <option value="Live dental advisory" data-i18n="svc.dental-advisory.title">Live dental advisory</option>
            <option value="Cavity inspection" data-i18n="svc.cavity-inspection.title">Cavity inspection</option>
            <option value="Pediatric dentistry" data-i18n="svc.pediatric-dentistry.title">Pediatric dentistry</option>
            <option value="Dental implants" data-i18n="svc.dental-implants.title">Dental implants</option>
         </select>

         <label for="date" data-i18n="appt.date">Appointment date and time</label>
         <input type="datetime-local" id="date" name="date" class="box" required>

         <div class="form-actions">
            <button type="submit" class="link-btn" data-i18n="btn.book">Book Appointment</button>
         </div>

      </form>

   </section>

</main>

<footer class="site-footer">
   <p class="credit">&copy; <span data-year>2026</span> <span class="brand">Bright Smile Clinic</span>. <span data-i18n="footer.rights">All rights reserved.</span></p>
</footer>

</body>

</html>
